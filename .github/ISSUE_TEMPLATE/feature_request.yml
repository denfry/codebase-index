name: Feature request
description: Propose an improvement or a new capability
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do with your agent that the tool makes hard today?
      placeholder: "When I ask Claude Code about ..., codebase-index returns ..., so the agent ends up reading ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? A CLI example or a sketch of the JSON is ideal.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Retrieval quality (ranking, fusion, budget)
        - Graph extraction (edges, impact, paths)
        - Language support
        - Indexing (discovery, parsing, freshness)
        - CLI / output format
        - MCP server
        - Claude Code / Codex / OpenCode integration
        - Benchmarks / evaluation
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: How would we know it worked?
      description: Retrieval changes need a measurable effect (see tests/eval). A query and the file you expected is enough to start.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you tried
