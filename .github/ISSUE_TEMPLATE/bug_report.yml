name: Bug report
description: Something is wrong, crashes, or returns the wrong result
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. A reproducible report gets fixed fastest. Do not paste real secrets — the tool redacts snippets, your logs may not.

  - type: input
    id: version
    attributes:
      label: codebase-index version
      description: "`pip show codebase-index` (there is no --version flag)"
      placeholder: "1.9.0"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Python and OS
      placeholder: "Python 3.12.3 · macOS 14.4 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI
        - Claude Code skill / plugin
        - Codex CLI
        - OpenCode
        - MCP server
        - Installer scripts
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      placeholder: |
        Ran `codebase-index refs open_session --json` on <repo>. Expected the call in ctx.py; got an empty list with coverage.partial=false.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally against a public repository or a tiny snippet we can index.
      placeholder: |
        1. git clone https://github.com/... && cd ...
        2. codebase-index index
        3. codebase-index search "..." --json
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: "`codebase-index doctor` output"
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Relevant output (`--json` where applicable) or traceback
      render: shell
