name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # manual (re)publish — e.g. push an already-tagged version to PyPI

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,build]"
      - name: Version mirrors agree with the tag
        run: |
          python scripts/check_versions.py
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ver=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/codebase_index/__init__.py').read_text()).group(1))")
            [ "${GITHUB_REF_NAME}" = "v${ver}" ] || { echo "tag ${GITHUB_REF_NAME} != package version v${ver}"; exit 1; }
          fi
      - name: Test gate
        run: pytest
      - name: Build
        run: python -m build
      - name: Check
        run: twine check dist/*
      - name: Clean-machine smoke
        run: python scripts/release_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    # Only when a tag was pushed — a manual workflow_dispatch run publishes to
    # PyPI without recreating the GitHub release for an existing tag.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Release notes from CHANGELOG.md
        run: python scripts/release_notes.py --out release_notes.md
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          body_path: release_notes.md
          # Appends the auto-generated "What's Changed" PR list after the changelog body.
          generate_release_notes: true

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC for PyPI Trusted Publishing — no token stored anywhere
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
