# Ground-truth query set over this repository (self-hosted eval corpus).
#
# Why self-hosted: it is a real ~4k-LOC multi-package Python codebase that ships
# with the project, so the benchmark is reproducible by anyone who clones it — no
# external checkout, no network. A second, larger, Java corpus is evaluated via
# `--repo` (see tests/eval/README.md) to guard against overfitting to Python.
#
# Ground truth is OBJECTIVE: `expected_files` are the files that actually define
# the answer, verified against the source tree by `harness.validate_queries()`,
# which fails the run if a path or symbol no longer exists. The index cannot
# grade its own homework — these are written from the source, not from output.
#
# `category` groups queries for per-category reporting; it is not fed to the
# retriever. Categories follow the agent question taxonomy: navigation,
# exact_symbol, concept, bug, architecture, impact, test.

